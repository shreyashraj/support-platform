openapi: 3.0.3
info:
  title: Customer Entitlement & Support Case API
  version: 1.0.0
  description: |
    Internal platform API for Support, Finance and Customer Success tooling, and for the
    Support Copilot agent (via the MCP server in `mcp/`).

    **Resource model.** `customers` is an aggregate (entitlement + usage + open-case counts) because
    every consumer asked for that view and none of them should have to know three upstream systems.
    `cases` is exposed as its own resource because Salesforce-style case data is what callers
    mutate, and it is enriched with a small account block so a list view does not need N+1 calls.
    Raw upstream shapes (capitalised keys, CSV columns, XML) never leak through.

    **Versioning.** The major version lives in the path (`/v1`). Within a major version we only add
    optional fields, new enum values on responses (clients must tolerate unknown values), new
    endpoints and new optional parameters. Anything else ships as `/v2`. A deprecated endpoint keeps
    working for at least 12 months and answers with `Deprecation` (RFC 9745) and `Sunset`
    (RFC 8594) headers plus a `Link: <...>; rel="successor-version"` header. Those headers can
    appear on any response.

    **Errors.** Every error is `application/problem+json` (RFC 9457) with a stable machine `code`
    and the request's `correlationId`. Codes are listed on the `Problem` schema.

    **Auth.** OAuth 2.0 bearer tokens (OIDC provider issues them). Scopes gate operations; the
    `finance:read` scope additionally gates the `arrUsd` field. A token may carry an `accounts`
    claim that limits which accounts the caller can see (a CSM's book of business); anything
    outside it answers 404, not 403, so account ids can't be enumerated.

    **Concurrency and retries.** Cases carry an `ETag`. State changes require `If-Match`. POSTs
    require an `Idempotency-Key` so clients (and agents) can retry blindly.

    **REST vs GraphQL/gRPC.** See `DECISIONS.md` for why this is REST and where the other two win.
  contact:
    name: API Platform
    email: api-platform@example.com
  x-api-lifecycle: stable

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Customers
  - name: Cases
  - name: Webhooks

security:
  - oauth2: []

paths:
  /v1/customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Aggregated customer view (entitlement + usage + open cases)
      description: |
        Entitlement data is the core of this resource: if the entitlement system is unreachable the
        call fails with 503/504. Usage and case counts are optional enrichment: if their upstream
        is down the call still returns 200 with `degraded: true`, the affected block set to
        `null` and its name listed in `degradedSources`.

        `arrUsd` is only present when the token has `finance:read`.
      x-required-scopes: [customers:read]
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The customer.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '304':
          description: Not modified.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /v1/cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: List cases with filtering, sorting and cursor pagination
      description: |
        Filters combine with AND. `supportTier` and `renewalWithinDays` are cross-system filters:
        they are resolved against the entitlement system, so they fail with 503/504 if it is down.
        Without them, entitlement is only used to enrich each item with an `account` block and the
        response is flagged `degraded` if that enrichment is unavailable.

        Pagination is cursor based. `nextCursor` is opaque, bound to the filters and sort it was
        issued for, and `null` on the last page. Reusing a cursor with different filters is a 400.
        Answers the question "which Platinum customers have P1 cases open more than 48h and a
        renewal in the next 90 days" in one call:
        `?priority=P1&status=open&minOpenHours=48&supportTier=Platinum&renewalWithinDays=90`.
      x-required-scopes: [cases:read]
      parameters:
        - name: accountId
          in: query
          schema: { type: string, pattern: '^ACC-[0-9]{3,6}$' }
        - name: status
          in: query
          description: Repeat the parameter to match several statuses.
          schema:
            type: array
            items: { $ref: '#/components/schemas/CaseStatus' }
        - name: priority
          in: query
          description: Repeat the parameter to match several priorities.
          schema:
            type: array
            items: { $ref: '#/components/schemas/Priority' }
        - name: supportTier
          in: query
          schema: { $ref: '#/components/schemas/SupportTier' }
        - name: renewalWithinDays
          in: query
          description: Account renewal date falls between today and today + N days.
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: minOpenHours
          in: query
          description: Hours since `openedAt` is at least this value.
          schema: { type: integer, minimum: 1, maximum: 87600 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [openedAt, -openedAt, priority, -priority]
            default: -openedAt
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: A page of cases.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /v1/cases/{id}:
    get:
      tags: [Cases]
      operationId: getCase
      summary: Get one case with its comments
      description: The `ETag` returned here is what `If-Match` on `escalate` is compared against.
      x-required-scopes: [cases:read]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: The case.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /v1/cases/{id}/comments:
    post:
      tags: [Cases]
      operationId: addCaseComment
      summary: Add a comment (idempotent create)
      description: |
        The author is taken from the token's subject, never from the body.

        Replaying the same `Idempotency-Key` with the same body returns the original response with
        `Idempotent-Replayed: true` and creates nothing. The same key with a different body is a
        422. A second request that arrives while the first is still running is a 409
        (`retryAfterSeconds` in the problem body). Keys are remembered for 24 hours per caller.
      x-required-scopes: [cases:write]
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '201':
          description: Comment created (or replayed).
          headers:
            Idempotent-Replayed:
              description: "`true` when this is a replay of an earlier request."
              schema: { type: string, enum: ['true'] }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /v1/cases/{id}/escalate:
    post:
      tags: [Cases]
      operationId: escalateCase
      summary: Escalate a case (state transition with business rules)
      description: |
        Moves the case to `escalated`, raises its priority one step (P1 stays P1), appends an
        audit comment in the case system and emits a `case.escalated` webhook.

        Rules, checked in this order:
        1. `If-Match` is required (428 without it) and must match the current ETag (412 otherwise).
        2. Only `open` and `pending` cases can be escalated. Escalated cases answer
           `case-already-escalated`, resolved/closed cases answer `case-not-escalatable` (both 409).
        3. P4 cases can't be escalated, re-prioritise first (422 `business-rule-violation`).
        4. Target `management` is only allowed for P1 and P2 cases (422 `business-rule-violation`).
      x-required-scopes: [cases:escalate]
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateRequest'
      responses:
        '200':
          description: The escalated case.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed:
              description: "`true` when this is a replay of an earlier request."
              schema: { type: string, enum: ['true'] }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /v1/webhook-subscriptions:
    get:
      tags: [Webhooks]
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      description: Secrets are never returned here, only at creation.
      x-required-scopes: [webhooks:admin]
      responses:
        '200':
          description: All subscriptions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      summary: Subscribe a URL to events
      description: |
        The signing secret is returned once, in this response, and never again.

        Every delivery is a `POST` of the event JSON with:
        * `X-Webhook-Id`: unique event id (also `id` in the body; use it to deduplicate, delivery is at-least-once)
        * `X-Webhook-Timestamp`: unix seconds
        * `X-Webhook-Signature`: `v1=` + hex HMAC-SHA256 of `"<timestamp>.<raw body>"` keyed with the secret

        Receivers must recompute the HMAC over the raw bytes, compare in constant time and reject
        timestamps older than 5 minutes. Any 2xx acknowledges the event; anything else is retried
        with exponential backoff (5s, 10s, 20s ... capped at 1h) up to 8 attempts, after which the
        event is parked as dead.
      x-required-scopes: [webhooks:admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCreated'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
      callbacks:
        caseEscalated:
          '{$request.body#/url}':
            post:
              summary: case.escalated event
              parameters:
                - name: X-Webhook-Id
                  in: header
                  required: true
                  schema: { type: string }
                - name: X-Webhook-Timestamp
                  in: header
                  required: true
                  schema: { type: string }
                - name: X-Webhook-Signature
                  in: header
                  required: true
                  schema: { type: string, pattern: '^v1=[0-9a-f]{64}$' }
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/CaseEscalatedEvent'
              responses:
                '2XX':
                  description: Event accepted.

  /v1/webhook-subscriptions/{id}:
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookSubscription
      summary: Remove a subscription
      description: Stops future deliveries and drops any that are still queued for it.
      x-required-scopes: [webhooks:admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^whs_[0-9a-f]{16}$' }
      responses:
        '204':
          description: Deleted. Pending deliveries for it are dropped.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Tokens come from the corporate OIDC provider. The clientCredentials flow points at the local mock issuer.
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8080/mock/idp/token
          scopes:
            customers:read: Read the aggregated customer view
            finance:read: See contract value (`arrUsd`)
            cases:read: Read and search cases
            cases:write: Add case comments
            cases:escalate: Escalate cases
            webhooks:admin: Manage webhook subscriptions
        authorizationCode:
          authorizationUrl: https://idp.example.com/oauth2/authorize
          tokenUrl: https://idp.example.com/oauth2/token
          scopes:
            customers:read: Read the aggregated customer view
            finance:read: See contract value (`arrUsd`)
            cases:read: Read and search cases
            cases:write: Add case comments
            cases:escalate: Escalate cases
            webhooks:admin: Manage webhook subscriptions

  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^ACC-[0-9]{3,6}$', example: ACC-007 }
    CaseId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^CS-[0-9]{3,9}$', example: CS-10231 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated, unique per logical operation (a UUID is fine).
      schema: { type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        ETag from the last read of the case. Declared optional here only so the API can answer a
        missing header with a proper 428 problem instead of a generic 400.
      schema: { type: string, maxLength: 256 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string, maxLength: 256 }

  headers:
    ETag:
      description: Entity tag of the returned representation.
      schema: { type: string }
    CorrelationId:
      description: Echo of the caller's `X-Correlation-ID`, or one generated by the API. Quote it in support requests.
      schema: { type: string }
    RateLimitLimit:
      description: Requests allowed in the current window (IETF RateLimit header fields).
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the window resets.
      schema: { type: integer }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  responses:
    BadRequest:
      description: Malformed or invalid request (`validation-error`, `invalid-cursor`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, expired or invalid bearer token (`unauthenticated`).
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Token is valid but lacks the scope for this operation (`forbidden`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource, or not visible to the caller (`not-found`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        Request conflicts with current state: `idempotency-in-progress`, `case-already-escalated`,
        `case-not-escalatable`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: '`If-Match` does not match the current ETag (`precondition-failed`). Re-read and decide again.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: '`If-Match` header missing (`precondition-required`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: |
        Well-formed but not allowed: `idempotency-key-reuse` (same key, different body) or
        `business-rule-violation`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Per-caller rate limit exceeded (`rate-limited`).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: An upstream system answered with an error (`upstream-error`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: |
        An upstream system is known to be down and its circuit breaker is open
        (`upstream-unavailable`). Safe to retry after `Retry-After`.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GatewayTimeout:
      description: An upstream system did not answer in time (`upstream-timeout`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Priority:
      type: string
      enum: [P1, P2, P3, P4]
    CaseStatus:
      type: string
      enum: [open, pending, escalated, resolved, closed]
    SupportTier:
      type: string
      enum: [Platinum, Gold, Silver, Standard]
    EscalationTarget:
      type: string
      enum: [tier2, management, engineering]

    Problem:
      type: object
      description: |
        RFC 9457 problem details. `code` is the stable machine-readable value; `type` is its URI form.
        Codes: validation-error, invalid-cursor, unauthenticated, forbidden, not-found,
        idempotency-in-progress, idempotency-key-reuse, precondition-failed, precondition-required,
        case-already-escalated, case-not-escalatable, business-rule-violation, rate-limited,
        upstream-error, upstream-unavailable, upstream-timeout, internal-error.
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        correlationId: { type: string }
        retryAfterSeconds: { type: integer }
        upstream: { type: string, description: "Name of the failing upstream, when relevant." }
        errors:
          type: array
          description: Field-level problems for `validation-error`.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    AccountSummary:
      type: object
      nullable: true
      description: Null when entitlement data was unavailable (the response is then flagged degraded).
      additionalProperties: false
      required: [name, supportTier, renewalDate]
      properties:
        name: { type: string }
        supportTier: { $ref: '#/components/schemas/SupportTier' }
        renewalDate: { type: string, format: date, nullable: true }

    Comment:
      type: object
      additionalProperties: false
      required: [id, caseId, author, body, createdAt]
      properties:
        id: { type: string, example: CS-10231-C2 }
        caseId: { type: string }
        author: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    Case:
      type: object
      additionalProperties: false
      required: [id, accountId, priority, status, subject, openedAt, openHours, commentCount, escalatedAt, account]
      properties:
        id: { type: string, example: CS-10231 }
        accountId: { type: string, example: ACC-007 }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/CaseStatus' }
        subject: { type: string }
        openedAt: { type: string, format: date-time }
        openHours:
          type: integer
          description: Whole hours between `openedAt` and now.
        escalatedAt: { type: string, format: date-time, nullable: true }
        commentCount: { type: integer }
        account:
          $ref: '#/components/schemas/AccountSummary'
        comments:
          type: array
          description: Only present on `GET /v1/cases/{id}`.
          items: { $ref: '#/components/schemas/Comment' }

    CaseList:
      type: object
      additionalProperties: false
      required: [items, page, degraded, degradedSources]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Case' }
        page:
          type: object
          additionalProperties: false
          required: [limit, nextCursor]
          properties:
            limit: { type: integer }
            nextCursor: { type: string, nullable: true }
        degraded: { type: boolean }
        degradedSources:
          type: array
          items: { type: string, enum: [entitlement] }

    UsageMonth:
      type: object
      additionalProperties: false
      required: [month, protectedTb, apiCalls, activeUsers]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        protectedTb: { type: number }
        apiCalls: { type: integer, format: int64 }
        activeUsers: { type: integer }

    UsageSummary:
      type: object
      nullable: true
      description: Null when the usage warehouse was unavailable or has no rows for the account.
      additionalProperties: false
      required: [latestMonth, protectedTb, apiCalls, activeUsers, protectedTbChangePct, trend]
      properties:
        latestMonth: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        protectedTb: { type: number }
        apiCalls: { type: integer, format: int64 }
        activeUsers: { type: integer }
        protectedTbChangePct:
          type: number
          nullable: true
          description: Change versus the previous month, null when there is no previous month.
        trend:
          type: array
          description: Up to the last three months, oldest first.
          items: { $ref: '#/components/schemas/UsageMonth' }

    SupportSummary:
      type: object
      nullable: true
      description: Null when the case system was unavailable.
      additionalProperties: false
      required: [openCases, openP1Cases]
      properties:
        openCases: { type: integer }
        openP1Cases: { type: integer }

    Customer:
      type: object
      additionalProperties: false
      required: [id, name, supportTier, contractEnd, renewalDate, daysToRenewal, usage, support, degraded, degradedSources]
      properties:
        id: { type: string, example: ACC-007 }
        name: { type: string }
        supportTier: { $ref: '#/components/schemas/SupportTier' }
        contractEnd: { type: string, format: date, nullable: true }
        renewalDate: { type: string, format: date, nullable: true }
        daysToRenewal: { type: integer, nullable: true }
        arrUsd:
          type: integer
          format: int64
          description: Annual recurring revenue. Only present with the `finance:read` scope.
        usage:
          $ref: '#/components/schemas/UsageSummary'
        support:
          $ref: '#/components/schemas/SupportSummary'
        degraded: { type: boolean }
        degradedSources:
          type: array
          items: { type: string, enum: [usage, support] }

    CommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }

    EscalateRequest:
      type: object
      additionalProperties: false
      required: [reason, target]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500 }
        target: { $ref: '#/components/schemas/EscalationTarget' }

    SubscriptionRequest:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url: { type: string, format: uri, maxLength: 2000 }
        events:
          type: array
          minItems: 1
          items: { type: string, enum: [case.escalated] }

    Subscription:
      type: object
      additionalProperties: false
      required: [id, url, events, active, createdAt]
      properties:
        id: { type: string, example: whs_0123456789abcdef }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    SubscriptionCreated:
      type: object
      additionalProperties: false
      required: [id, url, events, active, createdAt, secret]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        secret:
          type: string
          description: Shown once. Store it in your secret manager.

    CaseEscalatedEvent:
      type: object
      additionalProperties: false
      required: [id, type, createdAt, data]
      properties:
        id: { type: string, example: evt_9f1c2b7a4d3e4f60 }
        type: { type: string, enum: [case.escalated] }
        createdAt: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: false
          required: [caseId, accountId, previousPriority, priority, target, reason, escalatedBy, correlationId]
          properties:
            caseId: { type: string }
            accountId: { type: string }
            previousPriority: { $ref: '#/components/schemas/Priority' }
            priority: { $ref: '#/components/schemas/Priority' }
            target: { $ref: '#/components/schemas/EscalationTarget' }
            reason: { type: string }
            escalatedBy: { type: string }
            correlationId: { type: string }
